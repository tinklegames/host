<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Wheels</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">

<style>
    body {
        margin: 0;
        overflow: hidden;
        background-color: black;
    }
    #game-container {
        width: 100vw;
        height: 100vh;
        position: relative;
        background-color: #3d88c7;
    }
    canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: inherit;
    }
</style>

<!-- Fonts -->
<link rel="stylesheet" href="./assets-3yukq3hdo5me9z5pcv/fonts/ClarendonLTStd-Bold.css">
<link rel="stylesheet" href="./assets-3yukq3hdo5me9z5pcv/fonts/HelveticaNeueLTStd-Roman.css">
<link rel="stylesheet" href="./assets-3yukq3hdo5me9z5pcv/fonts/ClarendonLTStd.css">
<link rel="stylesheet" href="./assets-3yukq3hdo5me9z5pcv/fonts/Bank-Gothic-Medium.css">
<link rel="stylesheet" href="./assets-3yukq3hdo5me9z5pcv/fonts/HelveticaNeueLTStd-Bd.css">
<link rel="stylesheet" href="./assets-3yukq3hdo5me9z5pcv/fonts/HelveticaNeueLTStd-Md.css">

</head>
<body>

<div id="game-container">
    <canvas width="1350" height="750"></canvas>
</div>

<script>
(function() {

    function getTitleLabel() {
        const labels = [
            "JS Edition",
            "HTML5 Edition",
            "Flashless Version",
            "RIP Flash Edition",
            "Flash Is Dead!",
            "Farewell Flash...",
            "Without that plugin",
            "Does Jim know I put this here?"
        ];
        return labels[Math.floor(Math.random() * labels.length)];
    }

    function get_latest_hw_version() {
        return fetch("happy-wheels-js/version.json")
            .then(resp => resp.json())
            .catch(err => {
                console.error("Failed to load version.json", err);
                throw err;
            });
    }

    function retryOnError(safemode) {
        if (safemode) {
            const urlParams = new URLSearchParams(window.location.search);
            urlParams.set("s", "on");
            window.location.search = urlParams;
        }
        setTimeout(() => window.location.reload(), (Math.random() * 4000) + 3000);
    }

    window["HW_SETTINGS"] = {
        siteURL: document.location.protocol + "//" + document.location.hostname + "/",
        pathPrefix: '',
        titleLabel: getTitleLabel(),
        titleLabelX: 645,
        titleLabelY: 250,
        titleLabelRotation: 0,
        titleLabelSize: 20,
        titleLabelColor: 0xfdfd65,
        resolutionZoomIncreaseRatio: 0.5,
        tesselation: "tess2"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const replayId = urlParams.get("replay_id");
    const levelId = urlParams.get("level_id");
    if(!isNaN(replayId)) window["HW_SETTINGS"]["replay_id"] = replayId;
    if(!isNaN(levelId)) window["HW_SETTINGS"]["level_id"] = levelId;

    function loadDependency(name, hash, safemode) {
        const script = document.createElement("script");
        let src = "./js/" + name + "." + hash + ".js";
        if(safemode) src += "?x=" + Math.random();
        script.src = src;
        script.defer = true;
        script.onerror = () => retryOnError(true);
        document.body.appendChild(script);
    }

    const safemodeEnabled = false;

    get_latest_hw_version().then(latest => {
        if(latest) {
            loadDependency("dependencies", latest.dependencies, safemodeEnabled);
            loadDependency("index", latest.index, safemodeEnabled);
        } else {
            console.error("version.json not loaded");
            retryOnError();
        }
    });

})();
</script>

</body>
</html>
