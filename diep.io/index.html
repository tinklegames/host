// 2) Block Cloudflare Turnstile scripts from ever loading
(function () {
  const originalCreate = document.createElement;
  document.createElement = function (tagName) {
    const el = originalCreate.call(document, tagName);
    if (tagName.toLowerCase() === "script") {
      const origSetAttribute = el.setAttribute;
      el.setAttribute = function (name, value) {
        if (
          name === "src" &&
          typeof value === "string" &&
          (value.includes("challenges.cloudflare.com") ||
           value.includes("cdn-cgi") ||
           value.includes("turnstile"))
        ) {
          console.warn("Blocked Cloudflare script:", value);
          return;
        }
        return origSetAttribute.call(this, name, value);
      };

      Object.defineProperty(el, "src", {
        get() {
          return el.getAttribute("src");
        },
        set(value) {
          if (
            typeof value === "string" &&
            (value.includes("challenges.cloudflare.com") ||
             value.includes("cdn-cgi") ||
             value.includes("turnstile"))
          ) {
            console.warn("Blocked Cloudflare script:", value);
            return;
          }
          el.setAttribute("src", value);
        }
      });
    }
    return el;
  };
})();
</script>
