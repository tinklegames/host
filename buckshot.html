<html lang="en">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            height: 100%;
            overflow: hidden;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        /* --- Tinkle-style loader overlay --- */
        #loader-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 24px;
            pointer-events: none;
            z-index: 2000;
        }

        .loader-panel {
            pointer-events: auto;
            width: min(640px, 100%);
            max-height: 60vh;
            background: radial-gradient(circle at top left, #414750 0, #1a1b20 55%, #111319 100%);
            border-radius: 16px;
            border: 1px solid rgba(211, 165, 16, 0.6);
            box-shadow:
                0 0 20px rgba(0, 0, 0, 0.8),
                0 0 32px rgba(211, 165, 16, 0.35);
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        #loader-overlay.loader-hidden .loader-panel {
            opacity: 0;
            transform: translateY(18px);
        }

        .loader-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .loader-title {
            font-family: "Orbitron", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 15px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            background: linear-gradient(90deg, #d3a410, #b7870f, #ffe4a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 6px rgba(211, 165, 16, 0.45));
            white-space: nowrap;
        }

        .loader-status {
            font-size: 12px;
            color: #f2f2f2;
            opacity: 0.9;
            flex: 1;
            text-align: right;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .loader-log {
            background: rgba(0, 0, 0, 0.55);
            border-radius: 10px;
            padding: 8px 10px;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 11px;
            color: #e4e4e4;
            line-height: 1.35;
            overflow-y: auto;
            max-height: 26vh;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
        }

        .loader-log::-webkit-scrollbar {
            width: 6px;
        }

        .loader-log::-webkit-scrollbar-track {
            background: transparent;
        }

        .loader-log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
        }

        .loader-log-line-system {
            color: #9cc9ff;
        }

        .loader-log-line-ok {
            color: #8ee38e;
        }

        .loader-log-line-warn {
            color: #ffd27f;
        }

        .loader-progress-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #unity-loading-bar {
            position: relative;
            width: 100%;
            height: 10px;
            background: #262831;
            border-radius: 999px;
            overflow: hidden;
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.08),
                0 0 18px rgba(211, 165, 16, 0.35);
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background-image: linear-gradient(90deg, #6e5210, #d3a410, #ffe4a1);
            box-shadow: 0 0 16px rgba(255, 228, 161, 0.75);
            border-radius: inherit;
            transition: width 0.1s ease-out;
        }

        .loader-progress-text {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 12px;
            color: #f5f5f5;
            opacity: 0.9;
        }

        #loader-percent {
            font-weight: 600;
        }

        #loader-detail {
            font-size: 11px;
            opacity: 0.8;
        }

        /* --- Intro screen --- */
        #intro-screen {
            position: fixed;
            inset: 0;
            background-color: #414141;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        #intro-screen.hidden-intro {
            opacity: 0;
            visibility: hidden;
        }

        #intro-logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s ease-out forwards;
        }

        #intro-title {
            font-family: "Orbitron", system-ui, -apple-system, BlinkMacSystemFont,
                sans-serif;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #d3a410, #b7870f, #ffe4a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(211, 165, 16, 0.4));
            opacity: 0;
            animation: titleFade 1s ease forwards 0.4s;
            text-align: center;
        }

        @keyframes titleFade {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%,
            100% {
                translate: 0px 36px;
            }

            50% {
                translate: 0px 46px;
            }
        }

        @keyframes bounce2 {
            0%,
            100% {
                translate: 0px 46px;
            }

            50% {
                translate: 0px 56px;
            }
        }

        @keyframes umbral {
            0% {
                stop-color: #d3a5102e;
            }

            50% {
                stop-color: rgba(211, 165, 16, 0.519);
            }

            100% {
                stop-color: #d3a5102e;
            }
        }

        @keyframes particles {
            0%,
            100% {
                translate: 0px 16px;
            }

            50% {
                translate: 0px 6px;
            }
        }

        #particles {
            animation: particles 4s ease-in-out infinite;
        }

        #animatedStop {
            animation: umbral 4s infinite;
        }

        #bounce {
            animation: bounce 4s ease-in-out infinite;
            translate: 0px 36px;
        }

        #bounce2 {
            animation: bounce2 4s ease-in-out infinite;
            translate: 0px 46px;
            animation-delay: 0.5s;
        }
    </style>

    <!-- Tinkle loader helper -->
    <script>
        window.TINKLE_LOADER = (function () {
            const logQueue = [];
            let elementsReady = false;
            let loaderLog, loaderStatus, loaderPercent, loaderDetail;

            function initElements() {
                loaderLog = document.getElementById("loader-log");
                loaderStatus = document.getElementById("loader-status");
                loaderPercent = document.getElementById("loader-percent");
                loaderDetail = document.getElementById("loader-detail");

                elementsReady = !!loaderLog;
                if (elementsReady && logQueue.length) {
                    logQueue.forEach(item => addLog(item.message, item.kind));
                    logQueue.length = 0;
                }
            }

            function addLog(message, kind = "system") {
                if (!elementsReady) {
                    logQueue.push({ message, kind });
                    return;
                }
                if (!loaderLog) return;

                const line = document.createElement("div");
                const time = new Date().toLocaleTimeString("en-US", {
                    hour12: false,
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                });

                let cssClass = "loader-log-line-system";
                if (kind === "ok") cssClass = "loader-log-line-ok";
                else if (kind === "warn") cssClass = "loader-log-line-warn";

                line.className = cssClass;
                line.textContent = `[${time}] ${message}`;
                loaderLog.appendChild(line);
                loaderLog.scrollTop = loaderLog.scrollHeight;
            }

            function setStatus(text) {
                if (!elementsReady) {
                    logQueue.push({ message: text, kind: "system" });
                }
                if (loaderStatus) loaderStatus.textContent = text;
            }

            function setProgress(p, detail) {
                if (loaderPercent) {
                    loaderPercent.textContent = Math.round(p * 100) + "%";
                }
                if (loaderDetail && detail) {
                    loaderDetail.textContent = detail;
                }
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", initElements);
            } else {
                initElements();
            }

            addLog("Tinkle loader initialized.", "system");

            return {
                addLog,
                setStatus,
                setProgress
            };
        })();
    </script>

    <!-- Network tap for .pck parts -->
    <script>
        (function () {
            const PART_MARKER = "buckshot-roulette.pck.part";

            function filenameFromUrl(url) {
                try {
                    const u = new URL(url, window.location.href);
                    return u.pathname.split("/").pop();
                } catch {
                    return url.split("/").pop();
                }
            }

            // Patch fetch
            if (window.fetch) {
                const origFetch = window.fetch;
                window.fetch = function (input, init) {
                    let url = (typeof input === "string") ? input : (input && input.url);
                    const isPart = url && url.indexOf(PART_MARKER) !== -1;

                    if (isPart) {
                        const name = filenameFromUrl(url);
                        window.TINKLE_LOADER.addLog("Requesting " + name + "…", "system");
                        window.TINKLE_LOADER.setStatus("Downloading " + name + "…");
                    }

                    return origFetch(input, init).then(resp => {
                        if (isPart) {
                            const name = filenameFromUrl(url);
                            const len = resp.headers && resp.headers.get("content-length");
                            if (len) {
                                const mb = (parseInt(len, 10) / (1024 * 1024)).toFixed(2);
                                window.TINKLE_LOADER.addLog(
                                    "Downloaded " + name + " (" + mb + " MB).",
                                    "ok"
                                );
                            } else {
                                window.TINKLE_LOADER.addLog(
                                    "Downloaded " + name + " (size unknown).",
                                    "ok"
                                );
                            }
                        }
                        return resp;
                    });
                };
            }

            // Patch XHR (some Godot builds use it instead)
            if (window.XMLHttpRequest) {
                const OriginalXHR = window.XMLHttpRequest;

                function PatchedXHR() {
                    const xhr = new OriginalXHR();
                    let trackedUrl = null;

                    const origOpen = xhr.open;
                    xhr.open = function (method, url, async, user, password) {
                        trackedUrl = url;
                        if (url && url.indexOf(PART_MARKER) !== -1) {
                            const name = filenameFromUrl(url);
                            window.TINKLE_LOADER.addLog("Requesting " + name + "…", "system");
                            window.TINKLE_LOADER.setStatus("Downloading " + name + "…");
                        }
                        return origOpen.call(xhr, method, url, async, user, password);
                    };

                    xhr.addEventListener("load", function () {
                        if (trackedUrl && trackedUrl.indexOf(PART_MARKER) !== -1) {
                            const name = filenameFromUrl(trackedUrl);
                            let mb = null;
                            try {
                                // response may be ArrayBuffer / text etc
                                const len = xhr.response ? xhr.response.byteLength : 0;
                                if (len) {
                                    mb = (len / (1024 * 1024)).toFixed(2);
                                }
                            } catch (e) { }

                            if (mb) {
                                window.TINKLE_LOADER.addLog(
                                    "Downloaded " + name + " (" + mb + " MB).",
                                    "ok"
                                );
                            } else {
                                window.TINKLE_LOADER.addLog(
                                    "Downloaded " + name + " (size unknown).",
                                    "ok"
                                );
                            }
                        }
                    });

                    return xhr;
                }

                PatchedXHR.prototype = OriginalXHR.prototype;
                window.XMLHttpRequest = PatchedXHR;
            }

            window.TINKLE_LOADER.addLog("Network tap enabled for buckshot-roulette.pck.part* files.", "system");
        })();
    </script>

    <div id="status">

    <!-- Godot game scripts -->
    <script src="buckshot-roulette.js"></script>
    <script>
        const GODOT_CONFIG = {
            "args": [],
            "canvasResizePolicy": 2,
            "ensureCrossOriginIsolationHeaders": false,
            "executable": "buckshot-roulette",
            "experimentalVK": false,
            "fileSizes": {
                "buckshot-roulette.pck": 344705792,
                "buckshot-roulette.wasm": 43444261
            },
            "focusCanvas": false,
            "gdextensionLibs": []
        };
        const GODOT_THREADS_ENABLED = false;
        const engine = new Engine(GODOT_CONFIG);

        function run() {
            const statusOverlay = document.getElementById('status');
            const statusProgress = document.getElementById('status-progress');
            const statusNotice = document.getElementById('status-notice');

            const overlay = document.getElementById('loader-overlay');
            const progressBarFull = document.getElementById('unity-progress-bar-full');

            let initializing = true;
            let statusMode = '';

            // Compute total size for MB display
            const fileSizes = GODOT_CONFIG.fileSizes || {};
            const totalBytesConfig = Object.values(fileSizes).reduce((a, b) => a + b, 0);
            const totalMBConfig = totalBytesConfig > 0
                ? (totalBytesConfig / (1024 * 1024)).toFixed(2)
                : null;

            window.TINKLE_LOADER.setStatus("Initializing Buckshot Roulette…");
            window.TINKLE_LOADER.addLog("Booting Godot Web engine…", "system");
            if (totalMBConfig) {
                window.TINKLE_LOADER.addLog(
                    "Expected download size: " + totalMBConfig + " MB (wasm + pck).",
                    "system"
                );
                if (fileSizes["buckshot-roulette.wasm"] && fileSizes["buckshot-roulette.pck"]) {
                    window.TINKLE_LOADER.addLog(
                        "Files: buckshot-roulette.wasm (" +
                        (fileSizes["buckshot-roulette.wasm"] / (1024 * 1024)).toFixed(2) +
                        " MB), buckshot-roulette.pck (" +
                        (fileSizes["buckshot-roulette.pck"] / (1024 * 1024)).toFixed(2) +
                        " MB).",
                        "system"
                    );
                }
            }

            function setStatusMode(mode) {
                if (statusMode === mode || !initializing) return;
                if (mode === 'hidden') {
                    statusOverlay.remove();
                    initializing = false;
                    return;
                }
                statusOverlay.style.visibility = 'visible';
                statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
                statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
                statusMode = mode;
            }

            function setStatusNotice(text) {
                while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
                const lines = text.split('\n');
                lines.forEach(line => {
                    statusNotice.appendChild(document.createTextNode(line));
                    statusNotice.appendChild(document.createElement('br'));
                });
            }

            function displayFailureNotice(err) {
                console.error(err);
                let msg;
                if (err instanceof Error) {
                    msg = err.message;
                } else if (typeof err === 'string') {
                    msg = err;
                } else {
                    msg = 'An unknown error occurred.';
                }
                setStatusNotice(msg);
                setStatusMode('notice');
                initializing = false;

                window.TINKLE_LOADER.setStatus("Error starting game.");
                window.TINKLE_LOADER.addLog("Godot startup error: " + msg, "warn");
            }

            const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
            if (missing.length !== 0) {
                const missingMsg =
                    'Error\nThe following features required to run Godot projects on the Web are missing:\n' +
                    missing.join('\n');
                window.TINKLE_LOADER.addLog("Missing browser features: " + missing.join(', '), "warn");

                if (GODOT_CONFIG['serviceWorker'] &&
                    GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] &&
                    'serviceWorker' in navigator) {

                    let serviceWorkerRegistrationPromise;
                    try {
                        serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
                    } catch (err) {
                        serviceWorkerRegistrationPromise = Promise.reject(
                            new Error('Service worker registration failed.')
                        );
                    }

                    Promise.race([
                        serviceWorkerRegistrationPromise.then((registration) => {
                            if (registration != null) {
                                return Promise.reject(new Error('Service worker already exists.'));
                            }
                            return registration;
                        }).then(() => engine.installServiceWorker()),
                        new Promise((resolve) => setTimeout(() => resolve(), 2000)),
                    ]).then(() => window.location.reload())
                        .catch((err) => console.error('Error while registering service worker:', err));
                } else {
                    displayFailureNotice(missingMsg);
                }
            } else {
                setStatusMode('progress');
                window.TINKLE_LOADER.addLog("Starting Godot game download…", "system");

                let lastLoggedStep = -1;

                engine.startGame({
                    onProgress: function (current, total) {
                        // Always show *something* in Tinkle loader, even if total == 0
                        console.log("Godot onProgress", current, total);
                        window.TINKLE_LOADER.addLog(
                            "onProgress: current=" + current + ", total=" + total,
                            "system"
                        );

                        let p = 0;
                        let loadedMB = "0.00";
                        let totalMB = totalMBConfig || "??.??";

                        if (total > 0 && current >= 0) {
                            p = current / total;
                            loadedMB = (current / (1024 * 1024)).toFixed(2);
                            totalMB = (total / (1024 * 1024)).toFixed(2);

                            statusProgress.value = current;
                            statusProgress.max = total;
                        } else {
                            // Streaming / unknown total – keep indeterminate <progress>
                            statusProgress.removeAttribute('value');
                            statusProgress.removeAttribute('max');
                        }

                        if (progressBarFull) {
                            progressBarFull.style.width = (p * 100) + "%";
                        }

                        let phase;
                        if (p === 0 && total === 0) {
                            phase = "Connecting to content server…";
                        } else if (p < 0.25) phase = "Downloading engine files…";
                        else if (p < 0.5) phase = "Loading game content…";
                        else if (p < 0.75) phase = "Initializing game world…";
                        else if (p < 0.95) phase = "Preparing final assets…";
                        else phase = "Almost ready…";

                        const detail = total > 0
                            ? `${phase} ${loadedMB} / ${totalMB} MB`
                            : `${phase} Streaming data…`;

                        window.TINKLE_LOADER.setProgress(p, detail);

                        const step = Math.floor(p * 10); // 0–10
                        if (step > lastLoggedStep && total > 0) {
                            lastLoggedStep = step;
                            window.TINKLE_LOADER.addLog(
                                `Progress: ${Math.round(p * 100)}% (${loadedMB} / ${totalMB} MB).`,
                                "system"
                            );
                        }
                    },
                }).then(() => {
                    setStatusMode('hidden');

                    window.TINKLE_LOADER.setStatus("Ready!");
                    window.TINKLE_LOADER.setProgress(1, "Game loaded.");
                    window.TINKLE_LOADER.addLog(
                        "Godot game started successfully. Handing off to player.",
                        "ok"
                    );

                    if (overlay) {
                        overlay.classList.add("loader-hidden");
                        setTimeout(() => overlay.remove(), 800);
                    }
                }, displayFailureNotice);
            }
        };
        window.godotRunStart = run;
    </script>

    <!-- Intro fade-out -->
    <script>
        window.addEventListener("load", () => {
            const intro = document.getElementById("intro-screen");
            if (!intro) return;
            setTimeout(() => {
                intro.classList.add("hidden-intro");
                setTimeout(() => intro.remove(), 800);
            }, 2500);
        });
    </script>
</body>
